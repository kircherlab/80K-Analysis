# R environment for cCRE_based_analysis/perform_bcalm_elements_cli.R and
# variant_based_analysis/perform_bcalm_variants_cli.R.
#
# BCalm itself is NOT a conda/CRAN package: clone it separately and pass its
# path as the <bcalm_path> CLI argument (both scripts load it via
# devtools::load_all(bcalm_path)):
#   git clone git@github.com:kircherlab/BCalm.git
# (version 0.9.0 was used for the manuscript)
name: mpra80k_element_variant_processing
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.3
  - bioconductor-mpra=1.24.0
  - bioconductor-limma=3.58.1
  - r-devtools
  - r-dplyr
  - r-tidyr
  - r-ggplot2
  - r-arrow
  - pandoc
